<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MoraJunto - Foto de Perfil</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #333; font-family: 'DM Sans', sans-serif; }

/* Versao 1: So icone (melhor pra perfil) */
.profile-pic {
    width: 500px; height: 500px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6C3AED, #8B5CF6);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 8px rgba(108,58,237,.2);
}
.profile-pic svg { width: 300px; height: 300px; }

/* Versao 2: Icone + texto (pra post) */
.versions { display: flex; gap: 60px; align-items: center; flex-wrap: wrap; justify-content: center; }
.version { text-align: center; }
.version-label { color: #aaa; font-size: 14px; margin-top: 16px; }

.post-pic {
    width: 500px; height: 500px;
    background: linear-gradient(145deg, #0F1729, #080D1A);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 24px;
    border: 1px solid rgba(167,139,250,.1);
}
.post-pic svg { width: 180px; height: 180px; margin-bottom: 24px; }
.post-text { font-size: 48px; color: #fff; letter-spacing: -1px; }
.post-light { font-weight: 300; opacity: .6; }
.post-bold { font-weight: 800; background: linear-gradient(135deg, #A78BFA, #C4B5FD); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.post-sub { font-size: 16px; color: #94A3B8; margin-top: 8px; letter-spacing: 2px; text-transform: uppercase; }
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="versions">
    <!-- VERSAO 1: Foto de perfil (circular, so icone) -->
    <div class="version">
        <div class="profile-pic">
            <svg viewBox="0 0 100 100" fill="none">
                <path d="M25 65c0-14 11-25 25-25s25 11 25 25" stroke="rgba(255,255,255,.35)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <path d="M31 65c0-14 11-25 25-25s25 11 25 25" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <path d="M18 58L50 28L82 58" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="42" cy="44" r="5.5" fill="rgba(255,255,255,.45)"/>
                <circle cx="58" cy="44" r="5.5" fill="#fff"/>
            </svg>
        </div>
        <div class="version-label">Foto de perfil (salve esta)</div>
    </div>

    <!-- VERSAO 2: Post/Story -->
    <div class="version">
        <div class="post-pic">
            <svg viewBox="0 0 100 100" fill="none">
                <rect width="100" height="100" rx="22" fill="#6C3AED"/>
                <path d="M25 62c0-12 10-22 22-22s22 10 22 22" stroke="rgba(255,255,255,.4)" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M31 62c0-12 10-22 22-22s22 10 22 22" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M20 58L50 32L80 58" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="44" cy="44" r="5" fill="rgba(255,255,255,.5)"/>
                <circle cx="56" cy="44" r="5" fill="#fff"/>
            </svg>
            <div class="post-text"><span class="post-light">mora</span><span class="post-bold">junto</span></div>
            <div class="post-sub">Ribeirao Preto</div>
        </div>
        <div class="version-label">Post / Story</div>
    </div>
</div>
</body>
</html>
