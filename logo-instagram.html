<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MoraJunto - Logo Instagram</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #080D1A; }
.logo-wrap { width: 1080px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(145deg, #0F1729, #080D1A); }
.logo-icon { width: 320px; height: 320px; margin-bottom: 40px; }
.logo-text { font-family: 'DM Sans', 'Segoe UI', sans-serif; font-size: 72px; color: #fff; letter-spacing: -2px; }
.logo-light { font-weight: 300; opacity: .7; }
.logo-bold { font-weight: 800; background: linear-gradient(135deg, #A78BFA, #C4B5FD); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo-sub { font-family: 'DM Sans', sans-serif; font-size: 24px; color: #94A3B8; margin-top: 16px; letter-spacing: 4px; text-transform: uppercase; }
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="logo-wrap">
    <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="22" fill="#6C3AED"/>
        <path d="M25 62c0-12 10-22 22-22s22 10 22 22" stroke="rgba(255,255,255,.4)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M31 62c0-12 10-22 22-22s22 10 22 22" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M20 58L50 32L80 58" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="44" cy="44" r="5" fill="rgba(255,255,255,.5)"/>
        <circle cx="56" cy="44" r="5" fill="#fff"/>
    </svg>
    <div class="logo-text">
        <span class="logo-light">mora</span><span class="logo-bold">junto</span>
    </div>
    <div class="logo-sub">Divida o aluguel com confianca</div>
</div>
</body>
</html>
